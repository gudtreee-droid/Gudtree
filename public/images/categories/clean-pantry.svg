<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="cp-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </radialGradient>
    <filter id="cp-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#78350F" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#cp-bg)" />
  <circle cx="60" cy="60" r="53" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  
  <!-- Desi Cold-Pressed Oil Glass Bottle & Ghee Jar -->
  <g transform="translate(30, 26)" filter="url(#cp-shadow)">
    <!-- Wooden Oil Bottle -->
    <!-- Cap / Stopper -->
    <rect x="14" y="6" width="10" height="6" rx="2" fill="#78350F" />
    <!-- Neck -->
    <rect x="16" y="12" width="6" height="10" fill="#92400E" opacity="0.8" />
    <!-- Bottle Body -->
    <path d="M 12,22 C 8,26 6,34 6,56 C 6,60 10,62 19,62 C 28,62 32,60 32,56 C 32,34 30,26 26,22 Z" fill="#F59E0B" opacity="0.85" />
    <path d="M 14,23 C 10,27 8,35 8,55 C 8,59 11,60 19,60 C 27,60 30,59 30,55 C 30,35 28,27 24,23 Z" fill="#FBBF24" />
    <!-- Cold Pressed Label -->
    <rect x="10" y="36" width="18" height="14" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1" />
    <line x1="13" y1="41" x2="25" y2="41" stroke="#92400E" stroke-width="1.5" stroke-linecap="round" />
    <line x1="13" y1="45" x2="22" y2="45" stroke="#92400E" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Traditional Brass Ghee Martaban / Jar -->
    <g transform="translate(24, 24)">
      <!-- Lid Knob -->
      <circle cx="20" cy="4" r="3" fill="#B45309" />
      <ellipse cx="20" cy="8" rx="14" ry="4" fill="#D97706" />
      <!-- Jar Pot -->
      <path d="M 7,12 C 3,20 4,32 10,36 C 14,38 26,38 30,36 C 36,32 37,20 33,12 Z" fill="#F59E0B" />
      <path d="M 9,14 C 6,21 7,31 12,34 C 15,36 25,36 28,34 C 33,31 34,21 31,14 Z" fill="#FDE68A" />
      <!-- Pure A2 Stamp -->
      <circle cx="20" cy="24" r="6" fill="#B45309" />
      <path d="M 17,24 L 19,26 L 23,22" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- Natural Rock Salt Crystals -->
    <polygon points="5,58 9,52 14,56 12,62 6,62" fill="#FBCFE8" stroke="#F472B6" stroke-width="0.8" />
    <polygon points="48,58 52,53 58,57 56,62 49,62" fill="#FBCFE8" stroke="#F472B6" stroke-width="0.8" />
  </g>
</svg>