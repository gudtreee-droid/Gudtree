<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="kt-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5EB" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </radialGradient>
    <filter id="kt-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E65100" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#kt-bg)" />
  <circle cx="60" cy="60" r="53" fill="none" stroke="#FFA726" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  
  <!-- Bento Lunchbox Outer -->
  <g filter="url(#kt-shadow)">
    <rect x="25" y="32" width="70" height="56" rx="14" fill="#059669" />
    <rect x="27" y="34" width="66" height="52" rx="12" fill="#10B981" />
    <rect x="30" y="37" width="60" height="46" rx="9" fill="#ECFDF5" />
  </g>
  
  <!-- Bento Divider -->
  <line x1="58" y1="38" x2="58" y2="82" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" />
  <line x1="58" y1="60" x2="89" y2="60" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Section 1 (Left): Healthy Roti / Paneer Roll -->
  <g transform="translate(34, 42)">
    <rect x="0" y="2" width="19" height="34" rx="7" fill="#FDE68A" transform="rotate(-15 10 18)" />
    <rect x="3" y="5" width="13" height="28" rx="5" fill="#F59E0B" transform="rotate(-15 10 18)" opacity="0.3" />
    <!-- Spinach greens peeking -->
    <ellipse cx="6" cy="7" rx="3" ry="5" fill="#10B981" transform="rotate(-10 6 7)" />
    <ellipse cx="14" cy="27" rx="3" ry="5" fill="#10B981" transform="rotate(20 14 27)" />
  </g>
  
  <!-- Section 2 (Top Right): Crisp Apple Slices -->
  <g transform="translate(63, 41)">
    <path d="M 4,14 C 4,6 12,2 18,7 C 22,11 20,16 12,17 Z" fill="#EF4444" />
    <path d="M 6,13 C 6,8 12,5 16,8 C 19,11 17,14 11,15 Z" fill="#FEF2F2" />
    <!-- Apple Seed -->
    <ellipse cx="12" cy="11" rx="1" ry="1.5" fill="#78350F" />
  </g>
  
  <!-- Section 3 (Bottom Right): Crunchy Makhana / Nut Pops -->
  <g transform="translate(63, 64)">
    <circle cx="7" cy="8" r="4.5" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <circle cx="16" cy="6" r="3.5" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <circle cx="20" cy="12" r="3" fill="#FCD34D" />
  </g>
</svg>